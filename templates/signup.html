{% extends "base.html" %}
{% block title %}Sign Up — PlanIt{% endblock %}
{% block content %}
<div class="auth-page">
  <div class="auth-illustration">
    <div class="cloud cloud1">☁️</div>
    <div class="plane">✈️</div>
    <h1 class="brand-mark">PlanIt</h1>
    <p class="tagline">More trips. Better memories.</p>
    <div class="globe"></div>
  </div>
  <div class="auth-card-wrap">
    <div class="auth-card">
      <h2>Create your account</h2>
      <form method="POST">
        <div class="form-group">
          <label>Username:</label>
          <input type="text" name="username" required>
        </div>
        <div class="form-group">
          <label>Email:</label>
          <input type="email" name="email" required>
        </div>
        <div class="form-group">
          <label>Password:</label>
          <input type="password" name="password" required>
        </div>
        <button type="submit" class="btn-primary">Sign Up</button>
      </form>
      <p class="auth-switch">Already have an account? <a href="{{ url_for('login') }}">Log In</a></p>
    </div>
  </div>
</div>
{% endblock %}
